# Organisation profile on Codeberg (codeberg.org/OpenGewerk). GitHub stays the
# source of truth.
#
# Codeberg (Forgejo) shows an organisation profile from README.md in a
# repository named .profile, GitHub from profile/README.md in this one. This
# repository itself is not mirrored to Codeberg, only the profile is: the job
# writes profile/README.md as README.md into .profile.
#
# Author, committer, dates and message come from the last commit that touched
# profile/README.md, so an unchanged profile yields the same commit and the
# push changes nothing. --force overwrites anything committed there directly.
#
# Access is a deploy key registered for .profile on Codeberg only, not an
# account token and not a user SSH key. Both of those carry account-wide write
# access, so a single compromised repository would reach every Codeberg
# repository.
#
# Setup: generate the key with `pass-cli item create ssh-key generate`, add the
# public half under Repository -> Settings -> Deploy Keys of .profile with
# "Enable Write Access" ticked, and pipe the private half into the
# CODEBERG_SSH_KEY secret with
# `pass-cli item view ... --field private_key | gh secret set`.

name: Profil nach Codeberg

on:
  push:
    branches: ["main"]
    paths: ["profile/README.md", ".github/workflows/mirror.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Serial, and a running job is not cancelled: two parallel runs could leave an
# older state as the last write.
concurrency:
  group: mirror-codeberg
  cancel-in-progress: false

jobs:
  profile:
    name: Profil nach Codeberg pushen
    runs-on: ubuntu-latest
    if: github.repository_owner == 'OpenGewerk'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: README.md nach .profile pushen
        env:
          CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CODEBERG_SSH_KEY:-}" ]; then
            echo "::error::Das Secret CODEBERG_SSH_KEY fehlt."
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$CODEBERG_SSH_KEY" > "$HOME/.ssh/codeberg"
          chmod 600 "$HOME/.ssh/codeberg"

          # Pinned rather than obtained with ssh-keyscan, which trusts whatever
          # answers and would make StrictHostKeyChecking pointless. Verified
          # against docs.codeberg.org/security/ssh-fingerprint/ on 2026-09-03.
          # A rotation on their side breaks the push, which is the correct
          # reaction: verify the fingerprints again and replace these lines.
          {
            printf '%s\n' 'codeberg.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVIC02vnjFyL+I4RHfvIGNtOgJMe769VTF1VR4EB3ZB'
            printf '%s\n' 'codeberg.org ssh-rsa '
          } > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/codeberg -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          source_commit="$(git log -1 --format=%H -- profile/README.md)"
          export GIT_AUTHOR_NAME="$(git log -1 --format=%an "$source_commit")"
          export GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "$source_commit")"
          export GIT_AUTHOR_DATE="$(git log -1 --format=%aI "$source_commit")"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"

          profile="$RUNNER_TEMP/profile"
          git init --quiet --initial-branch=main "$profile"
          cp profile/README.md "$profile/README.md"
          git -C "$profile" add README.md
          git -C "$profile" commit --quiet --no-gpg-sign \
            --message "Profil aus OpenGewerk/.github@${source_commit}"

          target="${GITHUB_REPOSITORY_OWNER}/.profile"
          git -C "$profile" push --force "git@codeberg.org:${target}.git" main:main

          echo "Profil aktualisiert: codeberg.org/${target}"
